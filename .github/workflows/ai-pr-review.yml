# AI PR review, consumed from Aceiro (github.com/svozza/aceiro).
#
# Runs on every pull request. `pull_request_target` takes this file from the
# default branch, so a pull request cannot change its own reviewer.
#
# SETUP this repository already has: environments `ai-pr-review` (with a
# required reviewer) and `ai-pr-review-runtime`, plus BEDROCK_ROLE_ARN.
#
# The pin is a full 40-char SHA, never a branch or tag. Keep it equal to the
# pin in ai-pr-fix.yml: `/fix` reads the artifact this workflow's run produced.
#
# No concurrency block: the harness declares its own per-pull-request group.

name: AI PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: svozza/aceiro/.github/workflows/ai-pr-review.yml@498feaf5bffcd1890c3616e29ea80bd7bcc68177
    with:
      project-description: >-
        `svozza/artel`, a Rust workspace providing peer-to-peer collaboration
        for applications — sessions, NAT-traversed messaging, and file sync
        between machines over iroh, with a client crate talking to a local
        daemon over a Unix socket
      agent-timeout-minutes: 40
      # A second review pass when the first reports findings (Aceiro ADR-0022).
      # About one more review's cost on those pull requests, inside the 40 minutes.
      second-pass: true
    secrets:
      BEDROCK_ROLE_ARN: ${{ secrets.BEDROCK_ROLE_ARN }}
